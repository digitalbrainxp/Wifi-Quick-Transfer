name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restructure Project Files
        run: |
          mkdir -p app/src/main/java/com/example/wifishare app/src/main/res/values gradle/wrapper
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/ || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          mv *.kt app/src/main/java/com/example/wifishare/ 2>/dev/null || true
          mv colors.xml strings.xml themes.xml ic_launcher.xml app/src/main/res/values/ 2>/dev/null || true
          [ -f build.gradle.kts ] && mv build.gradle.kts app/ 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: WifiShare-APK
          path: app/build/outputs/apk/debug/app-debug.apk
